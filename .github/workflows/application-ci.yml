name: Application CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'contracts/**'
      - 'apps/**'
      - 'tests/**'
      - 'deploy/**'
      - 'scripts/verify.*'
      - '.github/workflows/application-ci.yml'
      - 'global.json'
      - 'Directory.*.props'
      - 'OpenLIMS.slnx'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      receiving-postgres:
        image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_DB: openlims_receiving_test
          POSTGRES_USER: openlims_test
          POSTGRES_PASSWORD: synthetic-receiving-test-password
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U openlims_test -d openlims_receiving_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      OPENLIMS_TEST_POSTGRES_CONNECTION: Host=127.0.0.1;Port=55432;Database=openlims_receiving_test;Username=openlims_test;Password=synthetic-receiving-test-password
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Enable pnpm 10.34.5
        run: corepack enable && corepack prepare pnpm@10.34.5 --activate
      - name: Restore backend (locked)
        run: dotnet restore OpenLIMS.slnx --locked-mode
      - name: Build backend
        run: dotnet build OpenLIMS.slnx -c Release --no-restore -warnaserror
      - name: Test backend
        run: dotnet test OpenLIMS.slnx -c Release --no-build
      - name: Verify module onboarding task profile
        run: bash scripts/verify.sh --profile task --module module-onboarding
      - name: Verify receiving task profile
        run: bash scripts/verify.sh --profile task --module receiving
      - name: Verify labeling task profile
        run: bash scripts/verify.sh --profile task --module labeling
      - name: Audit backend dependencies
        run: |
          dotnet list OpenLIMS.slnx package --vulnerable --include-transitive --format json > dotnet-vulnerabilities.json
          python -c "import json,sys; d=json.load(open('dotnet-vulnerabilities.json', encoding='utf-8')); found=[]; walk=lambda x: (found.extend(x.get('vulnerabilities', [])) if isinstance(x, dict) else None, [walk(v) for v in (x.values() if isinstance(x, dict) else x if isinstance(x, list) else [])]); walk(d); critical=[v for v in found if str(v.get('severity', '')).lower() == 'critical']; print(f'NuGet advisories: {len(found)} total, {len(critical)} critical'); sys.exit('Critical NuGet vulnerabilities found') if critical else None"
      - name: Restore frontend (locked)
        run: pnpm -C apps/web install --frozen-lockfile
      - name: Check frontend
        run: |
          pnpm -C apps/web lint
          pnpm -C apps/web typecheck
          pnpm -C apps/web test:unit
          pnpm -C apps/web build
      - name: Audit production frontend dependencies
        run: pnpm audit --prod --audit-level critical
      - name: Report all frontend dependency advisories
        continue-on-error: true
        run: pnpm audit --audit-level low
      - name: Validate development dependency composition
        run: docker compose --env-file deploy/compose/.env.example -f deploy/compose/compose.yaml config --quiet
      - name: Verify pinned dependency images
        run: |
          images="$(docker compose --env-file deploy/compose/.env.example -f deploy/compose/compose.yaml config --images)"
          test -n "$images"
          while IFS= read -r image; do
            printf '%s\n' "$image" | grep -Ex '.+@sha256:[a-f0-9]{64}'
          done <<< "$images"
      - name: Smoke test development dependencies
        run: |
          docker compose --env-file deploy/compose/.env.example -f deploy/compose/compose.yaml up -d postgres keycloak minio --wait
          docker compose --env-file deploy/compose/.env.example -f deploy/compose/compose.yaml run --rm minio-bootstrap
          curl --fail --silent --show-error http://127.0.0.1:8080/realms/openlims-development/.well-known/openid-configuration
          curl --fail --silent --show-error http://127.0.0.1:9000/minio/health/live
      - name: Smoke test migration, readiness, and trusted identity
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5080
          Platform__OrganizationGroupId: development-group
          Platform__PostgresConnectionString: Host=127.0.0.1;Port=5432;Database=openlims_development;Username=openlims_dev;Password=replace-with-a-local-synthetic-password
          Platform__PostgresCommandTimeoutSeconds: '10'
          Platform__OidcAuthority: http://127.0.0.1:8080/realms/openlims-development
          Platform__OidcAudience: openlims-api
          Platform__OidcMetadataTimeoutSeconds: '5'
          Platform__AllowInsecureDevelopmentOidc: 'true'
          Platform__ObjectStorageEndpoint: http://127.0.0.1:9000
          Platform__ObjectStorageBucket: openlims-development-development-group
          Platform__ObjectStorageAccessKey: local-minio-admin
          Platform__ObjectStorageSecretKey: replace-with-a-local-synthetic-password
          Platform__ObjectStorageProbeTimeoutSeconds: '5'
          Platform__AllowInsecureDevelopmentObjectStorage: 'true'
          Platform__DependencyProbeTimeoutSeconds: '15'
        run: |
          dotnet run --project src/host/worker/OpenLIMS.Worker/OpenLIMS.Worker.csproj -c Release --no-build -- --apply-platform-migration
          dotnet run --project src/host/worker/OpenLIMS.Worker/OpenLIMS.Worker.csproj -c Release --no-build -- --apply-module-migration receiving
          dotnet run --project src/host/worker/OpenLIMS.Worker/OpenLIMS.Worker.csproj -c Release --no-build -- --apply-module-migration labeling
          dotnet run --project tests/e2e/smoke/OpenLIMS.Platform.SmokeTests/OpenLIMS.Platform.SmokeTests.csproj -c Release --no-build
          dotnet run --project src/host/api/OpenLIMS.Api/OpenLIMS.Api.csproj -c Release --no-build > openlims-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:5080/health/ready && break
            if [ "$attempt" -eq 30 ]; then cat openlims-api.log; exit 1; fi
            sleep 1
          done
          token="$(curl --fail --silent --show-error \
            -d grant_type=client_credentials \
            -d client_id=openlims-ci \
            -d client_secret=synthetic-development-ci-secret \
            http://127.0.0.1:8080/realms/openlims-development/protocol/openid-connect/token \
            | python -c "import json,sys; print(json.load(sys.stdin)['access_token'])")"
          test -n "$token"
          curl --fail --silent --show-error -H "Authorization: Bearer $token" http://127.0.0.1:5080/system/status
      - name: Collect dependency logs
        if: always()
        run: docker compose --env-file deploy/compose/.env.example -f deploy/compose/compose.yaml logs --no-color
      - name: Stop development dependencies
        if: always()
        run: docker compose --env-file deploy/compose/.env.example -f deploy/compose/compose.yaml down -v
      - name: Check specifications
        run: |
          python -m tools.specgen validate --strict-warnings
          python -m tools.specgen check

  verify-module-onboarding-windows:
    runs-on: windows-2022
    env:
      OPENLIMS_TEST_POSTGRES_CONNECTION: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=root;Pooling=false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Start PostgreSQL for integration tests
        shell: pwsh
        run: |
          Set-Service -Name postgresql-x64-14 -StartupType Manual
          Start-Service -Name postgresql-x64-14
          $service = Get-Service -Name postgresql-x64-14
          $service.WaitForStatus([System.ServiceProcess.ServiceControllerStatus]::Running, [TimeSpan]::FromSeconds(30))
          & "$env:PGBIN\pg_isready.exe" -h 127.0.0.1 -p 5432 -U postgres -d postgres
          if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL did not become ready.' }
      - name: Verify module onboarding task profile
        shell: pwsh
        run: ./scripts/verify.ps1 -Profile task -Module module-onboarding
      - name: Verify labeling task profile
        shell: pwsh
        run: ./scripts/verify.ps1 -Profile task -Module labeling
